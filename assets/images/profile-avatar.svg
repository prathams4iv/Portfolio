<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0e2443" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8c291" />
      <stop offset="100%" stop-color="#e77f67" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3436" />
      <stop offset="100%" stop-color="#1e272e" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="180" />
    </clipPath>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#glowRing)" filter="url(#softGlow)" opacity="0.6" />
  <circle cx="200" cy="200" r="182" fill="#0b0f19" />
  
  <g clip-path="url(#circleClip)">
    <rect width="400" height="400" fill="url(#bgGrad)" />
    
    <!-- Ambient Coding Background grid lines -->
    <path d="M0 100 H400 M0 200 H400 M0 300 H400 M100 0 V400 M200 0 V400 M300 0 V400" stroke="#312e81" stroke-width="1" opacity="0.25" />
    
    <!-- Code floating symbols -->
    <text x="50" y="120" font-family="'Fira Code', monospace" font-size="22" fill="#6366f1" opacity="0.4">&lt;code&gt;</text>
    <text x="310" y="150" font-family="'Fira Code', monospace" font-size="20" fill="#06b6d4" opacity="0.4">{ C++ }</text>
    <text x="60" y="280" font-family="'Fira Code', monospace" font-size="18" fill="#10b981" opacity="0.3">#python</text>
    <text x="320" y="270" font-family="'Fira Code', monospace" font-size="20" fill="#f59e0b" opacity="0.3">&lt;/&gt;</text>

    <!-- Developer Character -->
    <!-- Shoulders / Hoodie -->
    <path d="M100 400 C100 320 140 280 200 280 C260 280 300 320 300 400 Z" fill="url(#hoodieGrad)" stroke="#334155" stroke-width="2" />
    <path d="M165 285 L200 340 L235 285" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
    
    <!-- Neck -->
    <rect x="180" y="235" width="40" height="55" rx="10" fill="url(#skinGrad)" />
    
    <!-- Head / Face -->
    <ellipse cx="200" cy="190" rx="60" ry="72" fill="url(#skinGrad)" />
    
    <!-- Hair -->
    <path d="M135 180 C130 110 170 105 200 105 C230 105 270 110 265 180 C265 160 250 135 200 135 C150 135 135 160 135 180 Z" fill="url(#hairGrad)" />
    <path d="M140 160 C150 120 185 115 200 115 C220 115 255 125 260 160 C240 145 220 140 200 140 C180 140 155 145 140 160 Z" fill="#1e272e" />

    <!-- Ears -->
    <circle cx="138" cy="192" r="12" fill="url(#skinGrad)" />
    <circle cx="262" cy="192" r="12" fill="url(#skinGrad)" />

    <!-- Eyebrows -->
    <path d="M162 166 Q178 162 190 166" fill="none" stroke="#2d3436" stroke-width="4" stroke-linecap="round" />
    <path d="M210 166 Q222 162 238 166" fill="none" stroke="#2d3436" stroke-width="4" stroke-linecap="round" />

    <!-- Glasses -->
    <rect x="152" y="174" width="38" height="26" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="3.5" />
    <rect x="210" y="174" width="38" height="26" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="3.5" />
    <line x1="190" y1="184" x2="210" y2="184" stroke="#6366f1" stroke-width="3.5" />
    <line x1="140" y1="182" x2="152" y2="182" stroke="#6366f1" stroke-width="3" />
    <line x1="248" y1="182" x2="260" y2="182" stroke="#6366f1" stroke-width="3" />

    <!-- Eyes inside glasses -->
    <circle cx="171" cy="187" r="4.5" fill="#1e293b" />
    <circle cx="229" cy="187" r="4.5" fill="#1e293b" />
    <circle cx="173" cy="185" r="1.5" fill="#ffffff" />
    <circle cx="231" cy="185" r="1.5" fill="#ffffff" />

    <!-- Nose -->
    <path d="M198 194 Q200 205 204 207" fill="none" stroke="#d63031" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Friendly Smile -->
    <path d="M182 222 Q200 234 218 222" fill="none" stroke="#2d3436" stroke-width="3.5" stroke-linecap="round" />

    <!-- Laptop edge in foreground -->
    <path d="M130 380 L270 380 L250 400 L150 400 Z" fill="#334155" />
    <rect x="140" y="376" width="120" height="5" rx="2" fill="#6366f1" opacity="0.8" />
  </g>

  <!-- Glowing Accent Border -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#glowRing)" stroke-width="4" />
</svg>
